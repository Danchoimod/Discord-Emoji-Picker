[package]
name = "discord_emoji"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
eframe = "0.33.3"
egui_extras = { version = "0.33.3", features = ["all_loaders", "gif", "webp", "image", "http"] }
enigo = "0.6.1"
image = { version = "0.25.10", features = ["gif", "png", "jpeg", "webp"] }
imageproc = "0.25.0"
raw-window-handle = "0.6"
reqwest = { version = "0.13.5", features = ["blocking", "default-tls"] }
rfd = "0.17.2"
tokio = { version = "1.54.0", features = ["full"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.dev.package."*"]
opt-level = 3
